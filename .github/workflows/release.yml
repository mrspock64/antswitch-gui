name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install Linux GUI build deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          out="antswitch-gui-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          go build -ldflags "-X main.Version=${{ github.ref_name }}" -o "$out" .
          echo "ASSET_PATH=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: antswitch-gui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ASSET_PATH }}

      # The raw binary above is what the in-app auto-updater downloads to
      # replace itself in place. It's not something a new user can install,
      # though — no .app bundle/icon, and Gatekeeper has no sane way to
      # trust a bare downloaded executable. Package a proper .app and wrap
      # it in a .dmg for first-time installs on macOS.
      - name: Package macOS .app and .dmg
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          go install fyne.io/fyne/v2/cmd/fyne@latest
          version="${GITHUB_REF_NAME#v}"
          "$(go env GOPATH)/bin/fyne" package --executable "$ASSET_PATH" --icon Icon.png --name AntSwitch --appID net.sm7iun.antswitch-gui --appVersion "$version"
          # fyne package leaves the bundle's Info.plist/resources unsealed
          # (only the inner Mach-O has a linker-added ad-hoc signature) —
          # macOS then refuses to launch it at all with a misleading "is
          # damaged and can't be opened" error instead of the normal
          # unidentified-developer prompt. A full ad-hoc re-sign of the
          # whole bundle fixes that (still not notarized, so Gatekeeper
          # still warns on first launch — just the correct warning).
          codesign --force --deep --sign - AntSwitch.app
          mkdir dmg-root
          cp -R AntSwitch.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "AntSwitch" -srcfolder dmg-root -ov -format UDZO AntSwitch-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        if: matrix.goos == 'darwin'
        with:
          name: antswitch-gui-macos-dmg
          path: AntSwitch-macos-arm64.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
